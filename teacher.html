<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>शिक्षक विभाग – बापूसाहेब देशमुख शिवाजी हायस्कूल</title>
<style>
:root{--maroon:#6A1327;--maroon-deep:#36081A;--gold:#C99A2E;--paper:#F6F3EE;--card:#fff;--chip:#f1ece4;--ink:#2A1A20;--muted:#6b5a60;--green:#1f8a4c;--red:#c62828;--amber:#d98a00;--blue:#2a6fb0;--line:#e5dfd6;--sh:0 2px 10px rgba(54,8,26,.07)}
@media (prefers-color-scheme:dark){:root{--paper:#150a0f;--card:#221218;--chip:#33202a;--ink:#f3eaec;--muted:#bba7ae;--line:#43303a;--sh:0 2px 10px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans Devanagari','Mukta','Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0)}
header.top{background:linear-gradient(135deg,var(--maroon-deep),var(--maroon) 60%,#8a1d36);color:#fff;padding:calc(10px + env(safe-area-inset-top,0)) 14px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.25)}
header.top img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
header.top .t{flex:1;min-width:0;font-weight:700;font-size:15px;line-height:1.25}
header.top .t small{display:block;font-weight:400;opacity:.85;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:700;transition:transform .12s,opacity .2s}
button:active{transform:scale(.97)}
.btn{background:var(--maroon);color:#fff}
.btn.gold{background:linear-gradient(135deg,#e0b348,var(--gold));color:#2b1a00}
.btn.ghost{background:var(--card);color:var(--maroon);border:1.5px solid var(--maroon)}
@media (prefers-color-scheme:dark){.btn.ghost{color:#f0c6d0;border-color:#f0c6d0}}
.btn.red{background:var(--red);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
header.top .out{background:rgba(255,255,255,.16);color:#fff;padding:7px 12px;font-size:13px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:calc(62px + env(safe-area-inset-top,0));z-index:19;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:var(--chip);color:var(--ink);white-space:nowrap;padding:8px 14px;border-radius:20px;font-size:14px}
nav.tabs button.on{background:var(--maroon);color:#fff;box-shadow:0 2px 8px rgba(106,19,39,.35)}
main{max-width:900px;margin:0 auto;padding:14px 12px 70px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:16px;color:var(--maroon)}
@media (prefers-color-scheme:dark){.card h3{color:#f0c6d0}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
select,input,textarea{font:inherit;padding:10px 12px;border:1.5px solid #cfc6b8;border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
@media (prefers-color-scheme:dark){select,input,textarea{border-color:#5a4350}}
select:focus,input:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
input.bad{border-color:var(--red);background:#fff1f1;color:#000}
textarea{width:100%;min-height:130px}
label.f{display:block;margin:8px 0 4px;font-weight:600;font-size:14px}
.note{color:var(--muted);font-size:14px}
.err{color:var(--red);font-weight:600;min-height:1.4em;margin:6px 0}
.sum{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sum span{padding:6px 12px;border-radius:20px;font-weight:700;font-size:14px;color:#fff}
.sum .p{background:var(--green)}.sum .a{background:var(--red)}.sum .l{background:var(--amber)}.sum .b{background:var(--blue)}
.stu{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);margin-bottom:6px;padding:10px 12px;border-radius:12px;font-weight:600}
.stu .r{min-width:34px;height:34px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:14px}
.stu .n{flex:1}
.stu .s{padding:4px 12px;border-radius:16px;color:#fff;font-size:13px;min-width:78px;text-align:center}
.stu.P .s{background:var(--green)}
.stu.A{border-color:var(--red)}.stu.A .s{background:var(--red)}
.stu.L{border-color:var(--amber)}.stu.L .s{background:var(--amber)}
.stu.H{border-color:#2f6fd6}.stu.H .s{background:#2f6fd6}
.stu.V{border-color:#8e5bd6}.stu.V .s{background:#8e5bd6}
.stu.M{border-color:#c2418a}.stu.M .s{background:#c2418a}
.stu.D{border-color:#168f8f}.stu.D .s{background:#168f8f}
.srow{display:flex;gap:6px;align-items:flex-start}.srow .stu{flex:1;margin-bottom:6px}.srow select{width:auto;max-width:112px;padding:8px 4px;font-size:13px;margin-bottom:6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;white-space:nowrap}
th{background:var(--chip)}
tr.lv1 td{background:rgba(217,138,0,.10)}tr.lv2 td{background:rgba(230,100,0,.16);font-weight:700}tr.lv3 td{background:rgba(198,40,40,.18);color:var(--red);font-weight:700}
.lnk{background:none;color:var(--maroon);padding:0;text-decoration:underline;font-weight:700;text-align:left}
@media (prefers-color-scheme:dark){.lnk{color:#f0c6d0}}
.badge{display:inline-block;padding:2px 10px;border-radius:14px;font-size:12px;font-weight:700;color:#fff;background:var(--muted)}
.badge.pending{background:var(--amber)}.badge.sent{background:var(--green)}.badge.failed{background:var(--red)}.badge.cancelled{background:#888}
.ins{border-color:var(--gold);background:linear-gradient(180deg,rgba(201,154,46,.10),transparent)}
.ins li{margin:6px 0}
tr.low td{background:rgba(198,40,40,.12);color:var(--red);font-weight:700}
td.fail{color:var(--red);font-weight:700}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{background:var(--chip);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;user-select:none}
.chk input{margin-right:4px;padding:0}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row2:last-child{border:0}
.ok{color:var(--green);font-weight:700}.no{color:var(--red);font-weight:700}
.login{max-width:400px;margin:40px auto;padding:0 14px}
.login .card{padding:20px}
.login h2{margin:0 0 4px;color:var(--maroon)}
a.wa{display:inline-block;background:#25D366;color:#fff;text-decoration:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
/* charts */
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut svg{width:140px;height:140px;flex:none}
.donut circle.seg{transition:stroke-dasharray .9s ease}
.leg{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.hb .lb{width:92px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{flex:1;height:14px;background:var(--chip);border-radius:8px;overflow:hidden}
.hb .fl{height:100%;border-radius:8px;width:0;transition:width .8s ease}
.hb .vl{width:48px;text-align:right;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:rgba(198,40,40,.12);color:var(--red);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi div{flex:1;min-width:110px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:22px;color:var(--maroon)}
@media (prefers-color-scheme:dark){.kpi b{color:#f0c6d0}}
.kpi small{color:var(--muted)}
.hw{border-left:4px solid var(--gold);padding:8px 10px;margin:8px 0;background:var(--chip);border-radius:0 10px 10px 0}
/* progress card preview / print */
#pv{position:fixed;inset:0;overflow:auto;background:#d9d4cc;z-index:200;padding:10px}
.pvbar{display:flex;gap:8px;justify-content:center;margin-bottom:10px;position:sticky;top:0;z-index:2}
.pc{background:#fff;color:#000;max-width:760px;margin:0 auto 14px;padding:26px 28px;border:3px double #6A1327;font-size:14px}
.pc h1{margin:0;font-size:19px;text-align:center;color:#6A1327}
.pc h2{margin:2px 0 12px;font-size:15px;text-align:center}
.pc table{font-size:13px}
.pc th{background:#f3ece0;color:#000}
.pc th,.pc td{border:1px solid #999;padding:5px 8px}
.pc .sig{display:flex;justify-content:space-between;margin-top:46px;font-size:13px}
.pc .meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin-bottom:10px}
@media print{
  body>#app,#toast{display:none!important}
  #pv{position:static;background:#fff;padding:0;overflow:visible}
  .pvbar{display:none}
  .pc{margin:0;border:3px double #6A1327;page-break-after:always;max-width:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="sublist"></datalist>
<datalist id="examlist"></datalist>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== सेटिंग्ज (गरज असल्यास येथेच बदला) ===== */
const CONFIG = {
  ADMIN_EMAIL: "diliprajnekar@gmail.com",
  FIREBASE: {
    apiKey: "AIzaSyDZG-v3w_7NAtWmlkZgZbqpXWCbGXrq1vw",
    authDomain: "bapusaheb-school.firebaseapp.com",
    projectId: "bapusaheb-school",
    storageBucket: "bapusaheb-school.firebasestorage.app",
    messagingSenderId: "521170776952",
    appId: "1:521170776952:web:20bbc4042fb5218cf64e8d"
  },
  SCHOOL: 'बापूसाहेब देशमुख शिवाजी हायस्कूल व कनिष्ठ महाविद्यालय, चांदूर रेल्वे',
  STDS: [5, 6, 7, 8, 9, 10],
  DIVS: { A: 'अ', B: 'ब', C: 'क' },
  SR: [11, 12],
  LOW_PCT: 75,      /* पातळी १ (सूचना): यापेक्षा कमी */
  SERIOUS_PCT: 65,  /* पातळी २ (गंभीर इशारा) */
  CRIT_PCT: 50,     /* पातळी ३ (अतिगंभीर) */
  PASS_PCT: 35,     /* विषयात उत्तीर्ण होण्यासाठी किमान % */
  SUBJECTS: ['मराठी', 'हिंदी', 'इंग्रजी', 'गणित', 'विज्ञान', 'सामाजिक शास्त्रे', 'इतिहास', 'भूगोल', 'संस्कृत', 'संगणक', 'कला', 'शारीरिक शिक्षण', 'राज्यशास्त्र', 'अर्थशास्त्र', 'समाजशास्त्र', 'तत्त्वज्ञान'],
  EXAMS: ['घटक चाचणी १', 'घटक चाचणी २', 'प्रथम सत्र परीक्षा', 'द्वितीय सत्र परीक्षा', 'सराव परीक्षा']
};
const CLASSES = [];
CONFIG.STDS.forEach(s => Object.keys(CONFIG.DIVS).forEach(d => CLASSES.push({ key: s + '-' + d, label: s + ' वी - ' + CONFIG.DIVS[d] })));
CONFIG.SR.forEach(s => CLASSES.push({ key: s + '-ARTS', label: s + ' वी (कला)' }));
const clsLabel = k => (CLASSES.find(c => c.key === k) || { label: k }).label;
CONFIG.SUBJECTS.forEach(s => $dl('sublist', s)); CONFIG.EXAMS.forEach(s => $dl('examlist', s));
function $dl(id, v) { const o = document.createElement('option'); o.value = v; document.getElementById(id).append(o); }

/* ===== helpers (innerHTML नाही → सुरक्षित) ===== */
const $ = s => document.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, props, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(props || {})) e.setAttribute(k, v);
  for (const c of kids.flat()) { if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }
const pad = n => String(n).padStart(2, '0');
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return iso(new Date()); }
function lastDays(n) { const a = []; const d = new Date(); d.setDate(d.getDate() - (n - 1)); for (let i = 0; i < n; i++) { a.push(iso(d)); d.setDate(d.getDate() + 1); } return a; }
function dmy(s) { const p = s.split('-'); return p[2] + '-' + p[1] + '-' + p[0]; }
const loading = () => h('p', { class: 'note', text: 'लोड होत आहे…' });
const pctOf = x => (x && x.total) ? Math.round(((x.present || 0) + (x.late || 0)) * 100 / x.total) : null;
const colorPct = p => p === null ? '#999' : p >= CONFIG.LOW_PCT ? 'var(--green)' : 'var(--red)';
const gradeOf = p => p >= 90 ? 'A+' : p >= 80 ? 'A' : p >= 70 ? 'B+' : p >= 60 ? 'B' : p >= 50 ? 'C' : p >= CONFIG.PASS_PCT ? 'D' : 'E';
const slug = s => s.trim().replace(/[\/\s]+/g, '-');

/* ===== शैक्षणिक वर्ष (१ जून – ३१ मे) ===== */
const LEGACY_YEAR = '2026-27'; /* 'year' नसलेले जुने गुण याच वर्षाचे धरले जातात */
const ayOf = d => { const p = d.split('-'), y = +p[0], m = +p[1], st = m >= 6 ? y : y - 1; return st + '-' + String(st + 1).slice(2); };
const curYear = () => ayOf(today());
const ayFrom = yr => yr.slice(0, 4) + '-06-01';
const ayTo = yr => (parseInt(yr.slice(0, 4), 10) + 1) + '-05-31';
const nextYear = yr => { const y = parseInt(yr.slice(0, 4), 10) + 1; return y + '-' + String(y + 1).slice(2); };
const prevYear = yr => { const y = parseInt(yr.slice(0, 4), 10) - 1; return y + '-' + String(y + 1).slice(2); };
function yearList() { const out = [], c = parseInt(curYear().slice(0, 4), 10); for (let y = c; y >= Math.min(2026, c); y--) out.push(y + '-' + String(y + 1).slice(2)); return out; }
function yearSel(val, onch) { const e = h('select', { 'aria-label': 'शैक्षणिक वर्ष' }); yearList().forEach(y => e.append(h('option', { value: y, text: 'वर्ष ' + y }))); e.value = val; e.addEventListener('change', () => onch(e.value)); return e; }

/* ===== छोटे ग्राफिक्स (SVG / CSS) ===== */
function donut(P, L, A, centerText, emptyText) {
  const R = 52, C = 2 * Math.PI * R, tot = P + L + A;
  const svg = sv('svg', { viewBox: '0 0 140 140', role: 'img', 'aria-label': 'हजेरी वर्तुळ आलेख' }, sv('circle', { cx: 70, cy: 70, r: R, fill: 'none', stroke: 'var(--chip)', 'stroke-width': 18 }));
  const segs = tot ? [[P, 'var(--green)'], [L, 'var(--amber)'], [A, 'var(--red)']] : [];
  let acc = 0;
  segs.forEach(([v, col]) => {
    if (!v) return; const len = C * v / tot;
    const c = sv('circle', { class: 'seg', cx: 70, cy: 70, r: R, fill: 'none', stroke: col, 'stroke-width': 18, 'stroke-dasharray': '0 ' + C, 'stroke-dashoffset': -acc, transform: 'rotate(-90 70 70)' });
    svg.append(c); acc += len; requestAnimationFrame(() => requestAnimationFrame(() => c.setAttribute('stroke-dasharray', len + ' ' + (C - len))));
  });
  svg.append(sv('text', { x: 70, y: tot ? 76 : 74, 'text-anchor': 'middle', 'font-size': tot ? 24 : 12, 'font-weight': 700, fill: 'currentColor' }, tot ? centerText : (emptyText || '—')));
  return svg;
}
function legend(P, L, A) {
  const li = (c, t) => h('div', {}, h('i', { style: 'background:' + c }), t);
  return h('div', { class: 'leg' }, li('var(--green)', 'उपस्थित ' + P), li('var(--amber)', 'उशीर ' + L), li('var(--red)', 'गैरहजर ' + A));
}
function hbar(label, pct, suffix, color) {
  const f = h('div', { class: 'fl', style: 'background:' + (color || colorPct(pct)) });
  requestAnimationFrame(() => requestAnimationFrame(() => f.style.width = (pct || 0) + '%'));
  return h('div', { class: 'hb' }, h('span', { class: 'lb', text: label, title: label }), h('div', { class: 'tr' }, f), h('span', { class: 'vl', text: pct === null ? '-' : (suffix === undefined ? pct + '%' : suffix) }));
}
function trend(points) { /* points: [{l, v}] v=% */
  const W = 320, H = 150, bw = Math.min(34, (W - 20) / Math.max(points.length, 1) - 8);
  const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, style: 'width:100%;height:auto', role: 'img', 'aria-label': 'गेल्या दिवसांची हजेरी' });
  [0, 50, 100].forEach(g => { const y = 118 - g * 0.9; svg.append(sv('line', { x1: 10, x2: W - 6, y1: y, y2: y, stroke: 'var(--line)' })); svg.append(sv('text', { x: 0, y: y + 3, 'font-size': 8, fill: 'var(--muted)' }, g)); });
  const step = (W - 24) / Math.max(points.length, 1);
  points.forEach((p, i) => {
    const x = 20 + i * step + (step - bw) / 2, v = p.v === null ? 0 : p.v, hh = Math.max(v * 0.9, 2);
    svg.append(sv('rect', { x, y: 118 - hh, width: bw, height: hh, rx: 4, fill: p.v === null ? '#999' : (p.v >= CONFIG.LOW_PCT ? '#1f8a4c' : '#c62828') }));
    svg.append(sv('text', { x: x + bw / 2, y: 112 - hh, 'text-anchor': 'middle', 'font-size': 9, 'font-weight': 700, fill: 'currentColor' }, p.v === null ? '' : p.v + '%'));
    svg.append(sv('text', { x: x + bw / 2, y: 132, 'text-anchor': 'middle', 'font-size': 9, fill: 'var(--muted)' }, p.l));
  });
  return svg;
}

/* ===== Firebase ===== */
let auth, db;
try {
  firebase.initializeApp(CONFIG.FIREBASE);
  auth = firebase.auth(); db = firebase.firestore();
  if (db.enablePersistence) db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
} catch (e) { console.error(e); }

let me = null, pendingErr = '', main = null, gotab = () => {};
const app = $('#app');
{ const ld = document.createElement('p'); ld.id = 'ld'; ld.className = 'note'; ld.style.cssText = 'padding:28px 16px;text-align:center'; ld.textContent = 'लोड होत आहे…'; app.append(ld);

function pinCard(getKey, canGen) {
  const msg = h('p', { class: 'note' });

      const need = (await loadStudents(getKey())).filter(s => !s.pin);

      else {

        await b.commit(); msg.textContent = need.length + ' विद्यार्थ्यांना PIN दिला.';

          if (tgt === 'PASS') { hs.push({ year: tgtYear, classKey: '', roll: null, result: 'passed', from: s.classKey }); b.update(db.collection('students').doc(s.id), { status: 'passed', passedYear: tgtYear, history: hs, updatedAt: now }); }
          else { let r = s.roll; if (taken.has(r)) r = ++mx; taken.add(r); mx = Math.max(mx, r); hs.push({ year: tgtYear, classKey: tgt, roll: r }); b.update(db.collection('students').doc(s.id), { classKey: tgt, roll: r, history: hs, updatedAt: now }); }
        });
        stay.forEach(s => { const hs = (s.history || []).slice(); hs.push({ year: tgtYear, classKey: s.classKey, roll: s.roll, repeat: true }); b.update(db.collection('students').doc(s.id), { history: hs, updatedAt: now }); });
        await b.commit(); toast('पदोन्नती झाली ✔'); paintP();
      } catch (e) { console.error(e); toast('पदोन्नती झाली नाही.'); go.disabled = false; }
    } });
    c.append(h('div', { class: 'bar', style: 'margin-top:10px' }, go)); pbox.append(c);
  }
  paintP();
}


/* ===== रजा अर्ज (पालकांकडून आलेले) ===== */
async function vLeave(root) {
  const keys = myKeys(); if (!keys.length) { root.append(noClass()); return; }
  let key = keys[0], ticket = 0; const box = h('div');
  root.append(h('div', { class: 'bar' }, classSel(keys, key, v => { key = v; load(); })),
    h('p', { class: 'note', text: 'पालकांनी leave.html वरून पाठवलेले अर्ज. मंजूर केल्यावर त्या तारखांना हजेरी उघडताच विद्यार्थी "रजा/वैद्यकीय रजा" म्हणून आपोआप भरला जातो. मंजुरीपूर्वी नाव व हजेरी क्रमांक जुळतो का ते पहा.' }), box);
  async function load() {
    const my = ++ticket; clear(box); box.append(loading());
    const q = await db.collection('leaveRequests').where('classKey', '==', key).get();
    if (my !== ticket) return; clear(box);
    const L = q.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (b.from || '').localeCompare(a.from || '')).slice(0, 60);
    if (!L.length) { box.append(h('p', { class: 'note', text: 'या वर्गाचे रजा अर्ज नाहीत.' })); return; }
    L.forEach(x => {
      const card = h('div', { class: 'card' }, h('b', { text: x.roll + '. ' + x.studentName }),
        h('p', { text: dmy(x.from) + (x.to !== x.from ? ' ते ' + dmy(x.to) : '') + ' • ' + (x.type === 'M' ? '🏥 वैद्यकीय रजा' : 'रजा') }),
        h('p', { text: 'कारण: ' + x.reason }), h('p', { class: 'note', text: 'पालक: ' + (x.parentName || '') + ' • ' + (x.parentPhone || '') }));
      const decide = async st => { try { await db.collection('leaveRequests').doc(x.id).update({ status: st, decidedBy: me.email, decidedAt: Date.now() }); toast(st === 'approved' ? '✅ मंजूर' : '❌ नामंजूर'); load(); } catch (e) { console.error(e); toast('जतन झाले नाही.'); } };
      if (x.status === 'pending') card.append(h('div', { class: 'bar' }, h('button', { class: 'btn gold', text: '✅ मंजूर', onclick: () => decide('approved') }), h('button', { class: 'btn red', text: '❌ नामंजूर', onclick: () => decide('rejected') })));
      else card.append(h('p', { class: 'note', text: x.status === 'approved' ? '✅ मंजूर' : '❌ नामंजूर' }));
      box.append(card);
    });
  }
  load();
}

/* ===== ८) शिक्षक (फक्त Admin) ===== */
async function vTea(root) {
  const em = h('input', { type: 'email', placeholder: 'शिक्षकाचा ईमेल', style: 'width:100%', 'aria-label': 'ईमेल' });
  const nm = h('input', { type: 'text', placeholder: 'शिक्षकाचे नाव', style: 'width:100%', 'aria-label': 'नाव' });
  const ph = h('input', { type: 'tel', placeholder: 'मोबाईल', style: 'width:100%', 'aria-label': 'मोबाईल' });
  const sj = h('input', { type: 'text', placeholder: 'विषय (स्वल्पविरामाने: गणित, विज्ञान)', style: 'width:100%', 'aria-label': 'विषय' });
  const stSel = h('select', { 'aria-label': 'स्थिती' }, h('option', { value: 'active', text: 'सक्रिय' }), h('option', { value: 'inactive', text: 'निष्क्रिय' }));
  const boxes = {}, grid = h('div', { class: 'chk' });
  CLASSES.forEach(c => { const cb = h('input', { type: 'checkbox', value: c.key }); boxes[c.key] = cb; grid.append(h('label', {}, cb, c.label)); });
  const msg = h('p', { class: 'note' }), list = h('div');
  const save = h('button', { class: 'btn gold', text: 'शिक्षक जतन करा', onclick: async () => {
    const email = em.value.trim().toLowerCase();
    if (!email || !nm.value.trim()) { msg.textContent = 'ईमेल आणि नाव दोन्ही भरा.'; return; }
    const classes = Object.keys(boxes).filter(k => boxes[k].checked); save.disabled = true;
    try {
      const old = await db.collection('teachers').doc(email).get(), o = old.exists ? old.data() : {};
      await db.collection('teachers').doc(email).set({ uid: o.uid || null, name: nm.value.trim(), email, phone: ph.value.trim(), role: 'teacher',
        subjects: sj.value.split(',').map(x => x.trim()).filter(Boolean), classes, status: stSel.value, joinedAt: o.joinedAt || Date.now(), lastLogin: o.lastLogin || null });
      msg.textContent = 'जतन झाले. या ईमेलचे खाते Firebase → Authentication → Users मध्ये जोडलेले असणे आवश्यक आहे.';
      em.value = nm.value = ph.value = sj.value = ''; stSel.value = 'active'; Object.values(boxes).forEach(b => b.checked = false); await show();
    } catch (e) { console.error(e); msg.textContent = 'जतन झाले नाही.'; }
    save.disabled = false;
  } });
  root.append(h('div', { class: 'card' }, h('h3', { text: 'शिक्षकाला वर्ग द्या' }), h('p', { class: 'note', text: 'शिक्षकाला फक्त त्याचेच वर्ग दिसतात. एका वर्गाला अनेक शिक्षक देता येतात (विषय शिक्षक). त्याच ईमेलने पुन्हा जतन केल्यास वर्ग बदलतात.' }),
    h('label', { class: 'f', text: 'ईमेल' }), em, h('label', { class: 'f', text: 'नाव' }), nm, h('label', { class: 'f', text: 'मोबाईल' }), ph, h('label', { class: 'f', text: 'विषय' }), sj, h('label', { class: 'f', text: 'स्थिती' }), stSel, h('label', { class: 'f', text: 'वर्ग (एक किंवा अधिक)' }), grid, h('div', { class: 'bar', style: 'margin-top:10px' }, save), msg), list);
  async function show() {
    clear(list); const q = await db.collection('teachers').get();
    const card = h('div', { class: 'card' }, h('h3', { text: 'सध्याचे शिक्षक: ' + q.size }));
    q.docs.forEach(d => { const x = d.data();
      card.append(h('div', { class: 'row2' }, h('span', {}, h('b', { text: x.name || '' }), ' (' + d.id + ')' + (x.status === 'inactive' ? ' ⛔ निष्क्रिय' : '') + (x.subjects && x.subjects.length ? ' • ' + x.subjects.join(', ') : '') + ' – ' + (x.classes || []).map(clsLabel).join(', ')),
        h('span', {}, h('button', { class: 'btn ghost sm', text: 'बदला', onclick: () => { em.value = d.id; nm.value = x.name || ''; ph.value = x.phone || ''; sj.value = (x.subjects || []).join(', '); stSel.value = x.status || 'active'; Object.keys(boxes).forEach(k => boxes[k].checked = (x.classes || []).includes(k)); window.scrollTo(0, 0); } }), ' ',
          h('button', { class: 'btn red sm', text: 'काढा', onclick: async () => { if (!confirm(d.id + ' काढायचे?')) return; await db.collection('teachers').doc(d.id).delete(); show(); } }))));
    });
    list.append(card);
  }
  await show();
}

<script type="module">
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('c'),loader=$('ld');
function fail(m){loader.style.display='flex';loader.innerHTML='<div>'+m+'<br><br><a href="science_lab_classic.html">Open the Classic 2D Lab</a></div>'}
let THREE,OrbitControls,RoomEnvironment,EffectComposer,RenderPass,UnrealBloomPass,OutputPass,RoundedBoxGeometry;
try{
 THREE=await import('three');
 ({OrbitControls}=await import('three/addons/controls/OrbitControls.js'));
 ({RoomEnvironment}=await import('three/addons/environments/RoomEnvironment.js'));
 ({EffectComposer}=await import('three/addons/postprocessing/EffectComposer.js'));
 ({RenderPass}=await import('three/addons/postprocessing/RenderPass.js'));
 ({UnrealBloomPass}=await import('three/addons/postprocessing/UnrealBloomPass.js'));
 ({OutputPass}=await import('three/addons/postprocessing/OutputPass.js'));
 ({RoundedBoxGeometry}=await import('three/addons/geometries/RoundedBoxGeometry.js'));
}catch(e){fail('The 3D engine could not be loaded. Please check your internet connection.');throw e}

/* ================= renderer / scene ================= */
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'high-performance'})}catch(e){fail('Your device does not support WebGL.');throw e}
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
function bgTex(){const c=document.createElement('canvas');c.width=16;c.height=512;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#0d1a40');gr.addColorStop(.55,'#08122e');gr.addColorStop(1,'#050a1c');g.fillStyle=gr;g.fillRect(0,0,16,512);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
scene.background=bgTex();scene.fog=new THREE.Fog(0x070f26,18,42);
const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
const camera=new THREE.PerspectiveCamera(36,16/9,.1,120);
const controls=new OrbitControls(camera,cv);controls.enableDamping=true;controls.dampingFactor=.08;controls.maxPolarAngle=Math.PI/2-.03;
const key=new THREE.DirectionalLight(0xfff1de,3);key.position.set(5,10,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
{const s=key.shadow.camera;s.left=-9;s.right=9;s.top=9;s.bottom=-9;s.near=1;s.far=32}key.shadow.bias=-.0003;key.shadow.normalBias=.03;key.shadow.radius=3;
const fill=new THREE.DirectionalLight(0x8fb4ff,.7);fill.position.set(-6,5,4);
const rim=new THREE.DirectionalLight(0xffffff,1.2);rim.position.set(-2,6,-8);
scene.add(key,fill,rim);
function noiseTex(size,rep){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');const id=g.createImageData(size,size);for(let i=0;i<size*size;i++){const v=110+Math.random()*60|0;id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v;id.data[i*4+3]=255}g.putImageData(id,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);return t}
{const nt=noiseTex(256,14);const fl=new THREE.Mesh(new THREE.CircleGeometry(32,64),new THREE.MeshStandardMaterial({color:0x22335a,roughness:.55,metalness:.1,roughnessMap:nt,bumpMap:nt,bumpScale:.6}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl)}
const G=new THREE.Group();scene.add(G);

/* ================= helpers ================= */
const V=(x,y,z)=>new THREE.Vector3(x,y,z),UPV=V(0,1,0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mesh=(g,m,p,o)=>{o=o||{};const x=new THREE.Mesh(g,m);if(p)x.position.set(p[0],p[1],p[2]);if(o.r)x.rotation.set(o.r[0],o.r[1],o.r[2]);x.castShadow=o.cast!==false;x.receiveShadow=o.recv!==false;return x};
function orient(m,a,b){const d=new THREE.Vector3().subVectors(b,a),L=d.length();if(L<1e-5){m.visible=false;return}m.visible=true;m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(UPV,d.multiplyScalar(1/L));m.scale.set(1,L,1)}
function makeBeam(color,r,k,op){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,10,1,true),new THREE.MeshBasicMaterial({color:new THREE.Color(color).multiplyScalar(k||2.2),transparent:true,opacity:op==null?1:op,blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,toneMapped:false,fog:false}));m.renderOrder=10;m.visible=false;m.castShadow=false;m.receiveShadow=false;return m}
function makeGlow(color,r,k){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),new THREE.MeshBasicMaterial({color:new THREE.Color(color).multiplyScalar(k||3),transparent:true,blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,toneMapped:false,fog:false}));m.renderOrder=11;m.castShadow=false;return m}
function makeArrow(color){const g=new THREE.Group();const mat=new THREE.MeshBasicMaterial({color:new THREE.Color(color).multiplyScalar(1.6),toneMapped:false,depthTest:false,fog:false});const sh=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1,12),mat),co=new THREE.Mesh(new THREE.ConeGeometry(.09,.22,16),mat);sh.renderOrder=co.renderOrder=11;g.add(sh,co);
 g.set=(a,b)=>{const d=new THREE.Vector3().subVectors(b,a),L=d.length();if(L<.05){g.visible=false;return}g.visible=true;const n=d.clone().normalize();orient(sh,a,b.clone().addScaledVector(n,-.2));co.position.copy(b).addScaledVector(n,-.11);co.quaternion.setFromUnitVectors(UPV,n)};return g}
const MAT={
 steel:()=>new THREE.MeshStandardMaterial({color:0xaab2bd,metalness:1,roughness:.28}),
 dark:()=>new THREE.MeshStandardMaterial({color:0x1b2233,metalness:.6,roughness:.45}),
 brass:()=>new THREE.MeshStandardMaterial({color:0xd9a441,metalness:1,roughness:.2}),
 copper:()=>new THREE.MeshStandardMaterial({color:0xc2703c,metalness:1,roughness:.3}),
 rubber:c=>new THREE.MeshStandardMaterial({color:c,roughness:.8,metalness:0}),
 glassFake:()=>new THREE.MeshPhysicalMaterial({color:0xdfeeff,metalness:0,roughness:.03,transparent:true,opacity:.2,envMapIntensity:2.4,clearcoat:1,clearcoatRoughness:.02,side:THREE.DoubleSide,depthWrite:false}),
 glassTrue:ior=>new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:0,transmission:1,thickness:1.2,ior,envMapIntensity:1.5,side:THREE.DoubleSide})
};
function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
function clearGroup(g){g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.map)m.map.dispose();m.dispose()})}});while(g.children.length)g.remove(g.children[0])}

/* ================= quality / composer ================= */
const Q={hd:1920,qhd:2560,uhd:3840,k5:5120};
const maxPx=Math.min(renderer.capabilities.maxTextureSize,5120);
let qSel='auto',autoW=1920,autoMax=2560,coolUntil=0,composer=null,rw=0,rh=0,fpsAvg=45;
function buildComposer(w,h){
 if(composer){composer.renderTarget1.dispose();composer.renderTarget2.dispose();composer.passes.forEach(p=>p.dispose&&p.dispose())}
 const rt=new THREE.WebGLRenderTarget(w,h,{type:THREE.HalfFloatType,samples:w>=3000?0:4});
 composer=new EffectComposer(renderer,rt);composer.addPass(new RenderPass(scene,camera));
 composer.addPass(new UnrealBloomPass(new THREE.Vector2(w,h),.32,.55,.92));composer.addPass(new OutputPass());
}
function applySize(force){
 const cw=Math.max(300,stage.clientWidth),ch=Math.max(200,stage.clientHeight);
 autoMax=Math.min(3840,maxPx,Math.round(cw*Math.max(devicePixelRatio||1,1)*1.5));
 let tw=force||(qSel==='auto'?Math.min(autoW,autoMax):Q[qSel]);tw=Math.min(tw,maxPx);
 const pr=tw/cw;renderer.setPixelRatio(pr);renderer.setSize(cw,ch,false);
 camera.aspect=cw/ch;camera.updateProjectionMatrix();
 rw=Math.round(cw*pr);rh=Math.round(ch*pr);buildComposer(rw,rh);fpsAvg=40;
}
new ResizeObserver(()=>{applySize();fitCam()}).observe(stage);
$('q').onchange=e=>{qSel=e.target.value;applySize()};
$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():(stage.requestFullscreen||stage.webkitRequestFullscreen).call(stage)};
let rotOn=!matchMedia('(pointer:coarse)').matches;
function setRot(){controls.enabled=rotOn;cv.style.touchAction=rotOn?'none':'pan-y';$('rot').textContent='🖐 Rotate: '+(rotOn?'on':'off')}
$('rot').onclick=()=>{rotOn=!rotOn;setRot()};
$('snap').onclick=async()=>{const b=$('snap'),old=b.textContent;b.disabled=true;b.textContent='Rendering…';await new Promise(r=>setTimeout(r,60));
 try{const sw=Math.min(5120,maxPx);applySize(sw);composer.render();const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  if(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='science-lab-'+cur.id+'-'+rw+'px.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}}
 catch(e){alert('This device could not render 5K. Try a lower quality.')}
 applySize();b.disabled=false;b.textContent=old};

/* ================= experiments ================= */
const PHHEX=['#e0141e','#e8202a','#ee3b2b','#f4602a','#f9852a','#fbb62e','#d9d32f','#4cae4f','#1fa38a','#1f7fc4','#3a5bc7','#5b46b5','#7a3aa8','#8c2f9a','#9a2a8c'];
const PHC=PHHEX.map(h=>new THREE.Color(h));
function phColor(p,out){const i=Math.min(13,Math.floor(p)),f=p-i;return out.copy(PHC[i]).lerp(PHC[i+1],f)}

/* ---- Pendulum ---- */
function pendulum(){let th,om,tSim,lastCross,meas,bob,str,arc,gr;const pv=V(0,3.9,0),tmp=V(0,0,0);
 function buildArc(P){if(arc){gr.remove(arc);arc.geometry.dispose()}const am=P.a*Math.PI/180,pts=[];for(let i=0;i<=40;i++){const a=-am+2*am*i/40;pts.push(V(P.L*Math.sin(a),pv.y-P.L*Math.cos(a),0))}
  arc=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),60,.006,6,false),new THREE.MeshBasicMaterial({color:0xffd23f,transparent:true,opacity:.55,toneMapped:false,fog:false}));gr.add(arc)}
 function reset(P){th=P.a*Math.PI/180;om=0;meas=0;lastCross=null;tSim=0;buildArc(P)}
 return{id:'pendulum',cls:9,name:'⏱️ Pendulum',
  ctrl:[{k:'L',label:'String length (m)',min:.4,max:2.4,step:.05,v:1.2},{k:'a',label:'Start angle (°)',min:5,max:60,step:1,v:25},{k:'g',label:'Gravity g (m/s²)',min:1.6,max:25,step:.1,v:9.8},{k:'c',label:'Air resistance',min:0,max:.6,step:.02,v:0}],
  cam:{t:[0,2.2,0],d:[.15,.12,1],w:6,h:5},
  info:'The time period of a simple pendulum is <b>T = 2π√(L/g)</b>. It depends on length and gravity, not on the mass of the bob. Try the Moon (g = 1.6) or Jupiter (g = 24.8). For large angles the real period is slightly longer than the formula.',
  build(g,P){gr=g;const steel=MAT.steel(),dark=MAT.dark();
   g.add(mesh(new THREE.BoxGeometry(2.4,.1,1.4),dark,[-.3,.05,0]));
   g.add(mesh(new THREE.CylinderGeometry(.04,.04,3.9,24),steel,[-1.1,2,0]));
   g.add(mesh(new THREE.CylinderGeometry(.03,.03,1.5,20),steel,[-.35,3.9,0],{r:[0,0,Math.PI/2]}));
   g.add(mesh(new THREE.BoxGeometry(.14,.18,.14),dark,[-1.1,3.9,0]));
   g.add(mesh(new THREE.SphereGeometry(.05,16,12),steel,[0,3.9,0]));
   bob=mesh(new THREE.SphereGeometry(.13,48,32),MAT.brass());g.add(bob);
   str=mesh(new THREE.CylinderGeometry(.004,.004,1,6),new THREE.MeshStandardMaterial({color:0xeeeeee,roughness:.6}),null,{cast:false});g.add(str);reset(P)},
  onChange(k,P){if(k!=='c')reset(P)},
  update(t,dt,P){const n=10,h=dt/n;for(let i=0;i<n;i++){const prev=th;om+=(-(P.g/P.L)*Math.sin(th)-2*P.c*om)*h;th+=om*h;tSim+=h;if(prev<0&&th>=0){if(lastCross!==null)meas=tSim-lastCross;lastCross=tSim}}
   tmp.set(P.L*Math.sin(th),pv.y-P.L*Math.cos(th),0);bob.position.copy(tmp);orient(str,pv,tmp);
   const T=2*Math.PI*Math.sqrt(P.L/P.g);return 'T = 2π√(L/g) = '+T.toFixed(2)+' s  ·  f = '+(1/T).toFixed(2)+' Hz'+(P.c<.01?'  ·  measured: '+(meas?meas.toFixed(2)+' s':'…'):'')}}}

/* ---- Density & floating ---- */
function density(){let blk,wat,wm,y=1,vy=0,lv=1.9,aW,aB,first=true;const W=3.4,D=2,Hh=2.6,s=.9,L0=1.9,A=(W-.1)*(D-.1);
 const cW=new THREE.Color(),cA=new THREE.Color(0xf2c46b),cB=new THREE.Color(0x9fd4ff),cC=new THREE.Color(0x7fe0d0),k1=new THREE.Color(0xcf9a58),k2=new THREE.Color(0xa6aeb8);
 return{id:'density',cls:9,name:'🧊 Density & Floating',
  ctrl:[{k:'po',label:'Object density (kg/m³)',min:200,max:3000,step:50,v:600},{k:'pl',label:'Liquid density (kg/m³)',min:700,max:1300,step:50,v:1000}],
  cam:{t:[0,1.3,0],d:[.12,.26,1],w:5.4,h:3.6},
  info:'A body <b>floats</b> if its density is less than the liquid, and <b>sinks</b> if it is more. While floating, Weight = Buoyant force (Archimedes): <b>ρ<sub>o</sub>·V·g = ρ<sub>l</sub>·V<sub>sub</sub>·g</b>, so the submerged fraction is ρ<sub>o</sub>/ρ<sub>l</sub>. The cube is 10 cm × 10 cm × 10 cm.',
  build(g,P){g.add(mesh(new THREE.BoxGeometry(W+.4,.08,D+.4),MAT.dark(),[0,.04,0]));
   const tank=mesh(new THREE.BoxGeometry(W,Hh,D),MAT.glassFake(),[0,.08+Hh/2,0],{cast:false,recv:false});tank.renderOrder=6;g.add(tank);
   wm=new THREE.MeshPhysicalMaterial({color:0xffffff,transmission:1,roughness:.02,thickness:1.6,ior:1.333,attenuationDistance:3,attenuationColor:0x9fd4ff});
   wat=mesh(new THREE.BoxGeometry(1,1,1),wm,null,{cast:false,recv:false});g.add(wat);
   blk=mesh(new RoundedBoxGeometry(s,s,s,4,.04),new THREE.MeshStandardMaterial({color:0xcf9a58,roughness:.55,metalness:0}));g.add(blk);
   aW=makeArrow(0xff4d4d);aB=makeArrow(0x4dff88);g.add(aW,aB);first=true},
  update(t,dt,P){const f=P.po/P.pl,fl=f<1,sub=fl?f*s:s,Vs=s*s*sub,lvT=L0+Vs/A;
   if(first){lv=lvT;y=fl?lvT-sub+s/2:.08+s/2;first=false}
   lv+=(lvT-lv)*(1-Math.exp(-4*dt));const yt=fl?lvT-sub+s/2:.08+s/2;
   const h=Math.min(dt,.03)/3;for(let i=0;i<3;i++){vy+=(-40*(y-yt)-5*vy)*h;y+=vy*h}
   y=Math.max(.08+s/2,y);blk.position.y=y;wat.scale.set(W-.1,lv,D-.1);wat.position.set(0,.08+lv/2,0);
   if(P.pl<=1000)cW.copy(cA).lerp(cB,(P.pl-700)/300);else cW.copy(cB).lerp(cC,(P.pl-1000)/300);
   wm.attenuationColor.copy(cW);
   const tt=clamp((P.po-200)/2800,0,1);blk.material.color.copy(k1).lerp(k2,tt);blk.material.metalness=Math.pow(tt,1.5);blk.material.roughness=.55-.25*tt;
   const Wt=P.po*1e-3*9.8,Fb=P.pl*1e-3*9.8*(Vs/(s*s*s));
   const c=blk.position;aW.set(V(c.x-.3,c.y,c.z+.5),V(c.x-.3,c.y-(.25+Wt*.07),c.z+.5));aB.set(V(c.x+.3,c.y,c.z+.5),V(c.x+.3,c.y+(.25+Fb*.07),c.z+.5));
   return 'W = '+Wt.toFixed(1)+' N  ·  Fb = '+Fb.toFixed(1)+' N  →  '+(fl?(Math.abs(f-1)<.02?'neutral, just floats':'FLOATS ('+(f*100).toFixed(0)+'% submerged)'):'SINKS')}}}

/* ---- Prism refraction & dispersion ---- */
function refract(I,N,eta){const c=-N.dot(I),k=1-eta*eta*(1-c*c);if(k<0)return null;return I.clone().multiplyScalar(eta).add(N.clone().multiplyScalar(eta*c-Math.sqrt(k)))}
function reflect(d,N){return d.clone().addScaledVector(N,-2*d.dot(N))}
function hitEdge(P,d,a,b){const ex=b.x-a.x,ey=b.y-a.y,den=d.x*ey-d.y*ex;if(Math.abs(den)<1e-9)return null;const wx=a.x-P.x,wy=a.y-P.y,t=(wx*ey-wy*ex)/den,u=(wx*d.y-wy*d.x)/den;return(t>1e-4&&u>=-1e-6&&u<=1+1e-6)?t:null}
function prism(){const sd=2,hh=sd*Math.sqrt(3)/2,base=.92,cy=base+hh/3;

   return 'B ∝ N × I = '+P.N+' × '+P.I.toFixed(1)+' = '+S.toFixed(0)+'  →  '+held+(held===1?' pin':' pins')+' lifted'+(P.I<.05?'  (current OFF)':'')}}}

const EXPS=[pendulum(),density(),prism(),lens(),acidbase(),magnet()];

/* ================= UI / controller ================= */
const T=$('slT'),K=$('slK'),O=$('slO'),I=$('slI'),B9=$('g9'),B10=$('g10');
let cur=null,P={},lastOut='',cg=9;
function fitCam(){if(!cur)return;const c=cur.cam,asp=camera.aspect||1.78,th=Math.tan(THREE.MathUtils.degToRad(camera.fov)/2),dist=Math.max(c.h/(2*th),c.w/(2*th*asp))*1.05;
 controls.target.set(c.t[0],c.t[1],c.t[2]);camera.position.copy(controls.target).addScaledVector(V(c.d[0],c.d[1],c.d[2]).normalize(),dist);controls.minDistance=dist*.4;controls.maxDistance=dist*2.2;controls.update()}
function select(i){if(cur&&cur.dispose)cur.dispose();clearGroup(G);cur=EXPS[i];P={};lastOut='';K.innerHTML='';
 T.querySelectorAll('button').forEach(b=>b.className=b.dataset.i==i?'on':'');
 cur.ctrl.forEach(c=>{P[c.k]=c.v;const d=document.createElement('div'),lb=document.createElement('label'),r=document.createElement('input'),b=document.createElement('b');
  r.type='range';r.min=c.min;r.max=c.max;r.step=c.step;r.value=c.v;b.textContent=c.v;lb.textContent=c.label+': ';lb.appendChild(b);
  r.oninput=()=>{P[c.k]=+r.value;b.textContent=r.value;if(cur.onChange)cur.onChange(c.k,P)};d.append(lb,r);K.appendChild(d)});
 cur.build(G,P);I.innerHTML=cur.info;fitCam()}
function cls(n){cg=n;B9.className=n==9?'on':'';B10.className=n==10?'on':'';T.innerHTML='';let first=-1;
 EXPS.forEach((e,i)=>{if(e.cls!=n)return;if(first<0)first=i;const b=document.createElement('button');b.type='button';b.textContent=e.name;b.dataset.i=i;b.onclick=()=>select(i);T.appendChild(b)});select(first)}
B9.onclick=()=>cls(9);B10.onclick=()=>cls(10);

/* ================= loop ================= */
let inView=true,raf=0,last=performance.now(),tAcc=0,fr=0;
function loop(now){raf=0;if(!inView||document.hidden)return;raf=requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;tAcc+=dt;
 const o=cur.update(tAcc,dt,P);if(o!==lastOut){O.textContent=o;lastOut=o}
 controls.update();composer.render();
 fpsAvg=fpsAvg*.94+(1/Math.max(dt,.001))*.06;
 if(++fr%20===0){$('hud').textContent=rw+'×'+rh+'  ·  '+Math.round(fpsAvg)+' fps';
  if(qSel==='auto'&&now>coolUntil){if(fpsAvg<26&&autoW>1280){autoW=Math.max(1280,Math.round(autoW*.78/16)*16);coolUntil=now+3000;applySize()}else if(fpsAvg>56&&autoW<autoMax){autoW=Math.min(autoMax,Math.round(autoW*1.2/16)*16);coolUntil=now+4000;applySize()}}}}
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}
new IntersectionObserver(e=>{inView=e[0].isIntersecting;if(inView)kick()},{threshold:.02}).observe(stage);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)kick()});
setRot();applySize();cls(9);loader.style.display='none';kick();
